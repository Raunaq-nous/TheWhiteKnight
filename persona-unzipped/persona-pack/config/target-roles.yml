# Raunaq Rakesh — Target Role Buckets

# Each bucket defines a target profile. The source-jobs skill scans portals
# and scores incoming JDs against these buckets. The score-job skill uses
# the same buckets to grade an individual JD.

buckets:

  - id: mbb-strategy
    name: MBB Strategy
    description: Senior strategy roles at top-tier consulting firms or equivalent.
    seniority: [senior, principal, manager, engagement-manager, project-leader]
    titles_match:
      - "engagement manager"
      - "project leader"
      - "principal"
      - "senior associate"
      - "associate vice president"
      - "manager strategy"
    titles_exclude:
      - "junior"
      - "entry-level"
    sectors_preferred:
      - energy
      - infrastructure
      - capital projects
      - technology
      - financial services
    geographies:
      - India
      - UAE
      - Qatar
      - Saudi Arabia
      - Singapore
      - UK
      - Remote
    keywords_required:
      - strategy OR consulting OR transformation
    keywords_boost:
      - financial modeling
      - M&A
      - due diligence
      - first principles
      - capital strategy
    target_companies:
      - Bain
      - BCG
      - McKinsey
      - Oliver Wyman
      - L.E.K.
      - Roland Berger
      - Strategy&
      - Kearney
      - EY-Parthenon
    weight_in_search: 0.30

  - id: ai-product
    name: AI Product
    description: Senior AI/ML product roles with agentic, RAG, or LLM application focus.
    seniority: [senior, lead, principal, staff, director]
    titles_match:
      - "ai product manager"
      - "senior product manager ai"
      - "lead product manager ai"
      - "ai engineer product"
      - "applied ai"
      - "ml product"
      - "agentic"
    sectors_preferred:
      - ai-frontier-tech
      - saas
      - fintech
      - enterprise-software
      - climate-tech
    geographies:
      - India (Bangalore, Mumbai, Gurgaon)
      - UAE
      - Singapore
      - Remote (any)
    keywords_required:
      - ai OR ml OR llm OR agentic
    keywords_boost:
      - agentic workflow
      - RAG
      - vector database
      - multi-agent
      - product roadmap
      - LLM application
    target_companies:
      - Anthropic
      - OpenAI
      - Cohere
      - Mistral
      - talabat
      - Brain Co
      - Coursera
      - Notion
      - Linear
      - Vercel
    weight_in_search: 0.30

  - id: chief-of-staff
    name: Chief of Staff / Founder Office
    description: Strategic right-hand-to-CEO roles at growth-stage tech companies.
    seniority: [senior, lead, principal, director]
    titles_match:
      - "chief of staff"
      - "founder's office"
      - "founders office"
      - "ceo office"
      - "executive associate"
      - "strategy and operations to ceo"
    sectors_preferred:
      - fintech
      - ai-frontier-tech
      - saas
      - marketplaces
      - climate-tech
      - web3
    geographies:
      - India
      - UAE
      - Remote (any)
    keywords_required:
      - chief of staff OR founder OR ceo office
    keywords_boost:
      - okr
      - cross-functional
      - founder partner
      - strategic initiatives
    target_companies:
      - KernelDAO
      - Souled Store
      - BrowserStack
      - Servify
      - Noon
      - Zepto
    weight_in_search: 0.20

  - id: strategy-ops
    name: Strategy & Operations
    description: Senior strategy/ops roles at growth-stage tech, fintech, and e-commerce.
    seniority: [senior, lead, principal, manager]
    titles_match:
      - "strategy and operations manager"
      - "strategy ops"
      - "business strategy"
      - "biz ops"
      - "senior strategy manager"
      - "head of strategy"
    sectors_preferred:
      - fintech
      - crypto
      - saas
      - marketplaces
      - e-commerce
      - climate-tech
    geographies:
      - India
      - UAE
      - Singapore
      - UK
      - Remote (any)
    keywords_required:
      - strategy OR operations OR business
    keywords_boost:
      - data-driven
      - ROI analysis
      - SQL
      - dashboards
      - cross-functional
    target_companies:
      - MoonPay
      - Stripe
      - Revolut
      - InMobi
      - Walmart
      - Adidas
      - Swiggy
      - Zepto
    weight_in_search: 0.20

# Scoring rubric used by the score-job skill
scoring:
  scale: 0-10
  weights:
    title_match: 0.20
    sector_match: 0.15
    seniority_match: 0.15
    keyword_required: 0.20
    keyword_boost: 0.10
    geography_match: 0.10
    target_company_match: 0.10
  thresholds:
    apply_immediately: 8.5
    tailor_and_apply: 7.0
    review_manually: 5.5
    archive_low_fit: 4.0

# Auto-archive rules
archive_rules:
  stale_after_days_no_response: 30
  stale_after_days_sourced_not_applied: 14
  auto_archive_below_score: 4.0
